[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-automation"
version = "0.1.0"
description = "CLI tools and Codex skills for Ocado and Sainsbury's grocery automation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
  {name = "Public Grocery Automation Contributors"}
]
dependencies = ["playwright>=1.58,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grocery-shopping = "grocery_automation.cli_grocery:main"
weekly-shop = "grocery_automation.cli_weekly:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
